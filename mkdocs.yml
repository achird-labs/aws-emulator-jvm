site_name: aws-emulator-jvm
site_description: aws-emulator inside the JVM process, bound to the AWS SDK for Java through FFM. No Docker, no ports, no TLS.
site_url: https://achird-labs.github.io/aws-emulator-jvm/
repo_url: https://github.com/achird-labs/aws-emulator-jvm
repo_name: achird-labs/aws-emulator-jvm
edit_uri: edit/main/docs/
copyright: Apache License 2.0 · Achird Labs
strict: true

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - content.action.edit
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Design:
      - Decision records:
          - decisions/README.md
          - 0001 A byte-level C ABI: decisions/0001-c-abi.md
          - 0002 FFM, not JNI or JNA: decisions/0002-ffm.md
          - 0003 Pin upstream by commit: decisions/0003-pinned-upstream.md
          - 0004 Own threads for async calls: decisions/0004-async-threads.md
          - 0005 Close waits, then refuses: decisions/0005-close-semantics.md
  - API reference: https://achird-labs.github.io/aws-emulator-jvm/api/
  - Development: development.md
