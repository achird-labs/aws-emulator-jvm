name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: emu-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Upstream aws-emulator is a large source dependency; caching its build keeps reruns short
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p emu-core --all-targets --locked -- -D warnings
      - run: cargo test -p emu-core --locked

  jvm:
    name: binding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The binding's tests load emu-core, which the build compiles before they fork
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sbt test
