<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="950" height="520" role="img" aria-label="One emu_dispatch call by memory: the JVM allocates the request in a confined arena, emu-core leaks the response buffers and writes their addresses into EmuResponse, the JVM copies them to its heap, then emu_response_free and the arena's close release each side's memory.">
