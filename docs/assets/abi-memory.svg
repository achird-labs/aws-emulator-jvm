<text x="40" y="88" class="tiny" text-anchor="start" fill="#22d3ee">JVM · CONFINED ARENA</text><text x="560" y="88" class="tiny" text-anchor="start" fill="#fbbf24">emu-core · RUST HEAP</text><text x="40" y="372" class="tiny" text-anchor="start" fill="#34d399">JVM · GC HEAP</text><line x1="520" y1="76" x2="520" y2="340" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5"/><text x="520" y="356" class="tag" text-anchor="middle" fill="#60a5fa">C ABI</text><g style="animation:k1 16.0s linear infinite;"><rect x="40" y="108" width="64" height="30" rx="5" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.4" filter="url(#glow)"/><text x="72.0" y="127.0" class="chip" text-anchor="middle" fill="#22d3ee">method</text></g><g style="animation:k2 16.0s linear infinite;"><rect x="114" y="108" width="64" height="30" rx="5" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.4" filter="url(#glow)"/><text x="146.0" y="127.0" class="chip" text-anchor="middle" fill="#22d3ee">uri</text></g><g style="animation:k3 16.0s linear infinite;"><rect x="188" y="108" width="120" height="30" rx="5" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.4" filter="url(#glow)"/><text x="248.0" y="127.0" class="chip" text-anchor="middle" fill="#22d3ee">header lines</text></g><g style="animation:k4 16.0s linear infinite;"><rect x="318" y="108" width="120" height="30" rx="5" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.4" filter="url(#glow)"/><text x="378.0" y="127.0" class="chip" text-anchor="middle" fill="#22d3ee">body</text></g><path d="M240 150 C300 190 460 190 590 150" class="arrow" stroke="#60a5fa" style="animation:k5 16.0s linear infinite;"/><text x="520" y="210" class="hud" text-anchor="middle" fill="#60a5fa" style="animation:k6 16.0s linear infinite;">emu_dispatch(…, out)</text><g style="animation:k7 16.0s linear infinite;"><rect x="560" y="108" width="170" height="30" rx="5" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.4" filter="url(#glow)"/><text x="645.0" y="127.0" class="chip" text-anchor="middle" fill="#fbbf24">http::Request&lt;Bytes&gt;</text></g><circle cx="860" cy="123" r="14" fill="none" stroke="#e879f9" stroke-width="2" class="pulse" style="animation:k8 16.0s linear infinite;"/><text x="860" y="158" class="tiny" text-anchor="middle">router</text><g style="animation:k9 16.0s linear infinite;"><rect x="560" y="240" width="150" height="30" rx="5" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.4" filter="url(#glow)"/><text x="635.0" y="259.0" class="chip" text-anchor="middle" fill="#fbbf24">headers · Box&lt;[u8]&gt;</text></g><g style="animation:k10 16.0s linear infinite;"><rect x="725" y="240" width="150" height="30" rx="5" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.4" filter="url(#glow)"/><text x="800.0" y="259.0" class="chip" text-anchor="middle" fill="#fbbf24">body · Box&lt;[u8]&gt;</text></g><g style="animation:k11 16.0s linear infinite;"><rect x="40" y="260" width="46" height="28" rx="5" fill="#e2e8f0" fill-opacity="0.16" stroke="#e2e8f0" stroke-width="1.4" filter="url(#glow)"/><text x="63.0" y="278.0" class="chip" text-anchor="middle" fill="#e2e8f0">status</text></g><text x="42" y="304" class="tiny" text-anchor="start" style="animation:k12 16.0s linear infinite;">0</text><g style="animation:k13 16.0s linear infinite;"><rect x="90" y="260" width="30" height="28" rx="5" fill="#334155" fill-opacity="0.16" stroke="#334155" stroke-width="1.4" filter="url(#glow)"/><text x="105.0" y="278.0" class="chip" text-anchor="middle" fill="#334155">pad</text></g><text x="92" y="304" class="tiny" text-anchor="start" style="animation:k14 16.0s linear infinite;">2</text><g style="animation:k15 16.0s linear infinite;"><rect x="124" y="260" width="84" height="28" rx="5" fill="#e2e8f0" fill-opacity="0.16" stroke="#e2e8f0" stroke-width="1.4" filter="url(#glow)"/><text x="166.0" y="278.0" class="chip" text-anchor="middle" fill="#e2e8f0">headers*</text></g><text x="126" y="304" class="tiny" text-anchor="start" style="animation:k16 16.0s linear infinite;">8</text><g style="animation:k17 16.0s linear infinite;"><rect x="212" y="260" width="84" height="28" rx="5" fill="#e2e8f0" fill-opacity="0.16" stroke="#e2e8f0" stroke-width="1.4" filter="url(#glow)"/><text x="254.0" y="278.0" class="chip" text-anchor="middle" fill="#e2e8f0">headers_len</text></g><text x="214" y="304" class="tiny" text-anchor="start" style="animation:k18 16.0s linear infinite;">16</text><g style="animation:k19 16.0s linear infinite;"><rect x="300" y="260" width="84" height="28" rx="5" fill="#e2e8f0" fill-opacity="0.16" stroke="#e2e8f0" stroke-width="1.4" filter="url(#glow)"/><text x="342.0" y="278.0" class="chip" text-anchor="middle" fill="#e2e8f0">body*</text></g><text x="302" y="304" class="tiny" text-anchor="start" style="animation:k20 16.0s linear infinite;">24</text><g style="animation:k21 16.0s linear infinite;"><rect x="388" y="260" width="84" height="28" rx="5" fill="#e2e8f0" fill-opacity="0.16" stroke="#e2e8f0" stroke-width="1.4" filter="url(#glow)"/><text x="430.0" y="278.0" class="chip" text-anchor="middle" fill="#e2e8f0">body_len</text></g><text x="390" y="304" class="tiny" text-anchor="start" style="animation:k22 16.0s linear infinite;">32</text><text x="40" y="326" class="tiny" text-anchor="start" fill="#e2e8f0" style="animation:k23 16.0s linear infinite;">EmuResponse · 40 bytes · offsets in bytes</text><path d="M166.0 260 C166.0 220 635 200 635 240" class="arrow" stroke="#fbbf24" stroke-dasharray="3 4" style="animation:k24 16.0s linear infinite;"/><path d="M342.0 260 C342.0 220 800 200 800 240" class="arrow" stroke="#fbbf24" stroke-dasharray="3 4" style="animation:k25 16.0s linear infinite;"/><g style="animation:k26 16.0s linear infinite;"><rect x="40" y="384" width="110" height="30" rx="5" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.4" filter="url(#glow)"/><text x="95.0" y="403.0" class="chip" text-anchor="middle" fill="#34d399">status</text></g><g style="animation:k27 16.0s linear infinite;"><rect x="160" y="384" width="170" height="30" rx="5" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.4" filter="url(#glow)"/><text x="245.0" y="403.0" class="chip" text-anchor="middle" fill="#34d399">headers: Map</text></g><g style="animation:k28 16.0s linear infinite;"><rect x="340" y="384" width="150" height="30" rx="5" fill="#34d399" fill-opacity="0.16" stroke="#34d399" stroke-width="1.4" filter="url(#glow)"/><text x="415.0" y="403.0" class="chip" text-anchor="middle" fill="#34d399">body: Array[Byte]</text></g><text x="510" y="403" class="tag" text-anchor="start" fill="#34d399" style="animation:k29 16.0s linear infinite;">EmuReply</text><text x="560" y="300" class="tag" text-anchor="start" fill="#e879f9" style="animation:k30 16.0s linear infinite;">emu_response_free</text><text x="510" y="125" class="tag" text-anchor="start" fill="#e879f9" style="animation:k31 16.0s linear infinite;">arena.close()</text><text x="40" y="446" class="log" text-anchor="start" fill="#e2e8f0" style="animation:k32 16.0s linear infinite;">1 · EmuCore allocates method, URI, header lines and body in a confined arena</text><text x="40" y="446" class="log" text-anchor="start" fill="#e2e8f0" style="animation:k33 16.0s linear infinite;">2 · emu_dispatch: emu-core reads them in place and copies the body into the request</text><text x="40" y="446" class="log" text-anchor="start" fill="#e2e8f0" style="animation:k34 16.0s linear infinite;">3 · the router answers; emu-core leaks the header lines and body as boxed slices</text><text x="40" y="446" class="log" text-anchor="start" fill="#e2e8f0" style="animation:k35 16.0s linear infinite;">4 · emu-core writes status and both pointers into EmuResponse, inside the arena</text><text x="40" y="446" class="log" text-anchor="start" fill="#e2e8f0" style="animation:k36 16.0s linear infinite;">5 · EmuCore copies both buffers onto the JVM heap as an EmuReply</text><text x="40" y="446" class="log" text-anchor="start" fill="#e2e8f0" style="animation:k37 16.0s linear infinite;">6 · emu_response_free: emu-core takes its buffers back and nulls the pointers</text><text x="40" y="446" class="log" text-anchor="start" fill="#e2e8f0" style="animation:k38 16.0s linear infinite;">7 · the arena closes; only the EmuReply is left, owned by the garbage collector</text>
<line x1="28" y1="470" x2="922" y2="470" stroke="#1e293b"/>
<text x="28" y="496" class="hud">every buffer has one owner at a time: the JVM frees what it allocated, and emu-core frees what it leaked</text>
</svg>
