<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 470" width="950" height="470" role="img" aria-label="Threads A and B dispatch at the same time under the read lock. close() asks for the write lock at once, waits until both calls finish, and frees the emulator. Thread C, which arrived while close was waiting, and thread D, which arrived after, both get IllegalStateException instead of touching freed memory.">
<defs>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="2.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
