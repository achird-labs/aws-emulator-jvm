"-17.0" y="-10" width="34" height="20" rx="4" fill="#34d399" fill-opacity="0.18" stroke="#34d399" stroke-width="1.5" filter="url(#glow)"/><text x="0" y="4" class="chip" text-anchor="middle" fill="#34d399">200</text></g><text x="36" y="410" class="hud" text-anchor="start" fill="#e2e8f0" style="animation:k20 19.5s linear infinite;">the SDK signs and builds an HTTP request, as it would for AWS</text><text x="36" y="410" class="hud" text-anchor="start" fill="#e2e8f0" style="animation:k21 19.5s linear infinite;">the binding reads the body and frames each header as one name: value line</text><text x="36" y="410" class="hud" text-anchor="start" fill="#e2e8f0" style="animation:k22 19.5s linear infinite;">a confined arena holds the bytes; emu_dispatch hands them over</text><text x="36" y="410" class="hud" text-anchor="start" fill="#e2e8f0" style="animation:k23 19.5s linear infinite;">the router picks the service from the request, as the standalone server does</text><text x="36" y="410" class="hud" text-anchor="start" fill="#34d399" style="animation:k24 19.5s linear infinite;">KMS answers; the same call returns status, header lines and body</text>
