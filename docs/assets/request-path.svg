<text x="36" y="88" class="tiny" text-anchor="start">JVM</text><text x="580" y="88" class="tiny" text-anchor="start">emu-core · Rust</text><line x1="566" y1="76" x2="566" y2="356" stroke="#334155" stroke-width="1.5" stroke-dasharray="5 5"/><text x="566" y="372" class="tag" text-anchor="middle" fill="#60a5fa">C ABI</text><line x1="186" y1="205" x2="592" y2="205" class="rail"/><line x1="186" y1="205" x2="592" y2="205" class="flow" stroke="#60a5fa"/><path d="M738 205 C778 205 748 120 788 120" class="rail" fill="none"/><path d="M738 205 C778 205 748 205 788 205" class="rail" fill="none"/><path d="M738 205 C778 205 748 290 788 290" class="rail" fill="none"/><rect x="36" y="176.0" width="150" height="58" rx="10" fill="url(#panel)" stroke="#334155"/><text x="111.0" y="203.0" class="big" text-anchor="middle">SDK client</text><text x="111.0" y="220.0" class="tiny" text-anchor="middle">DynamoDbClient …</text><rect x="212" y="176.0" width="150" height="58" rx="10" fill="url(#panel)" stroke="#334155"/><text x="287.0" y="203.0" class="big" text-anchor="middle">EmuHttpClient</text><text x="287.0" y="220.0" class="tiny" text-anchor="middle">SdkHttpClient SPI</text><rect x="388" y="176.0" width="150" height="58" rx="10" fill="url(#panel)" stroke="#334155"/><text x="463.0" y="203.0" class="big" text-anchor="middle">EmuCore</text><text x="463.0" y="220.0" class="tiny" text-anchor="middle">FFM downcall</text><rect x="592" y="176.0" width="146" height="58" rx="10" fill="url(#panel)" stroke="#334155"/><text x="665.0" y="203.0" class="big" text-anchor="middle">router</text><text x="665.0" y="220.0" class="tiny" text-anchor="middle">MultiServiceRouter</text><rect x="788" y="96" width="134" height="48" rx="10" fill="url(#panel)" stroke="#334155"/><text x="855.0" y="125.0" class="big" text-anchor="middle">DynamoDB</text><rect x="788" y="181" width="134" height="48" rx="10" fill="url(#panel)" stroke="#334155"/><text x="855.0" y="210.0" class="big" text-anchor="middle">S3</text><rect x="788" 