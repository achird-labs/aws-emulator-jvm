<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 470" width="950" height="470" role="img" aria-label="An AWS SDK client built with EmuHttpClient sends each request through EmuCore, across the emu-core C ABI, to the aws-emulator router, which hands it to DynamoDB, S3 or KMS and returns the response in the same call.">
